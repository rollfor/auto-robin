name: RollForAutoRobin Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    types: [opened, reopened, edited, synchronize]
    branches: [ "master" ]

# A pull request's code runs here, so its token can read the repo and nothing more.
permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: true

    - name: Run tests
      run: docker compose run --rm -T test

    # Runs even when the tests fail, so one push reports both.
    - name: Run checks
      if: success() || failure()
      run: docker compose run --rm -T check
