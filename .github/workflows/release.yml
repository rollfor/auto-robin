name: RollForAutoRobin Release

# Pushed by scripts/release.sh. A tag with a hyphen (v5.0.0-beta1) becomes a pre-release, so
# releases/latest/download/RollForAutoRobin.zip only ever points at a stable version.

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Check tag matches RollForAutoRobin.toc
      run: |
        version=$(sed -n 's/^## Version: *//p' RollForAutoRobin/src/RollForAutoRobin.toc)
        if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
          echo "RollForAutoRobin.toc says $version, but the tag is $GITHUB_REF_NAME"
          exit 1
        fi

    - name: Run tests
      run: docker compose run --rm -T test

    - name: Run checks
      run: docker compose run --rm -T check

    # The bundle container runs as HOST_UID, which defaults to 1000; the runner's user isn't,
    # and couldn't otherwise write the zip into out/.
    - name: Bundle
      run: |
        mkdir out
        HOST_UID=$(id -u) HOST_GID=$(id -g) BUNDLE_DIR="$PWD/out" docker compose run --rm -T bundle

    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        flags=(--title "$GITHUB_REF_NAME" --generate-notes)
        [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
        gh release create "$GITHUB_REF_NAME" out/RollForAutoRobin.zip "${flags[@]}"
